# Desktop builds, on demand: a Windows installer and zip, a macOS disk image,
# a Linux AppImage and tarball. Run it from the Actions tab (it never runs on
# its own); the builds are attached to the run as artifacts.
name: Desktop builds

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: npx electron-builder --win nsis zip --publish never
          - os: macos-latest
            command: npx electron-builder --mac dmg zip --publish never
          - os: ubuntu-latest
            command: npx electron-builder --linux AppImage tar.gz --publish never
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: ${{ matrix.command }}
        env:
          # No signing certificates yet: unsigned builds.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: survivor-unchained-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.zip
            release/*.dmg
            release/*.AppImage
            release/*.tar.gz
          if-no-files-found: error
