; Desktop builds of the game. Export with tools/godot/export.sh (or the
; editor's Project > Export). Builds land in release/godot/, which git ignores.
; Non-resource data (the zones' height fields, the content JSON) goes in by
; the include filter; everything the game loads as a resource goes in anyway.

[preset.0]

name="Windows"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json, data/*.bin, data/*.png"
exclude_filter=".shots/*, tests/*, tools_scenes/*, art/people/anime_female.glb, art/people/her_Hair_*.glb, art/people/woman.glb, art/people/woman_mask.png, art/people/hero.glb, assets/characters/*, assets/props/*, assets/anim/humanoid.glb, assets/ground/*.ktx2, assets/people/*.bake.webp, assets/env/polyhaven/*, art/vo/*"
export_path="../release/godot/windows/SurvivorUnchained.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

binary_format/embed_pck=false
binary_format/architecture="x86_64"
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
debug/export_console_wrapper=0
codesign/enable=false
application/modify_resources=true
application/icon="res://icon.png"
application/icon_interpolation=4
application/file_version="0.1.0.0"
application/product_version="0.1.0.0"
application/company_name="Munchtech"
application/product_name="Survivor Unchained"
application/file_description="Survivor Unchained"
application/copyright=""
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
dotnet/include_scripts_content=false
dotnet/include_debug_symbols=false
dotnet/embed_build_outputs=false

